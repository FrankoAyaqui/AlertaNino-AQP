# Lee los datos oficiales (SENAMHI, ENFEN) y de referencia (NOAA, Open-Meteo)
# y publica la web en GitHub Pages. Se ejecuta cada 30 minutos, en cada push
# y a mano desde la pestaña Actions. Los datos no se guardan como commits:
# viajan directamente en la publicación.
name: Actualizar datos y publicar

on:
  push:
    branches: [main, codex/entrega]
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar lector de PDF (comunicados ENFEN)
        run: pip install pypdf==5.1.0

      - name: Leer fuentes oficiales y de referencia
        run: python scripts/actualizar_datos.py

      - name: Validar avisos manuales
        run: python scripts/validar_avisos.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
