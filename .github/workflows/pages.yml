# Actualiza los índices de El Niño y publica la web en GitHub Pages.
# Se ejecuta al hacer push, cada 3 horas y a mano desde la pestaña Actions.
name: Actualizar datos y publicar

on:
  push:
    branches: [main, codex/entrega]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar índices y calcular umbrales
        run: python scripts/actualizar_datos.py

      - name: Validar avisos manuales
        run: python scripts/validar_avisos.py

      - name: Guardar datos actualizados en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/indicadores.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "datos: actualizar índices El Niño [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
